proxy:
  brave_api: http://localhost:5000
  container: http://localhost:8089
  onlyoffice: http://localhost:8080

route:
  # gateway | traefik | k8s-ingress
  registry: gateway
  # analysis app reverse proxy prefix
  apps_prefix: /c/analysis/apps
  # gateway registry mapping persistence uses database table `go_gateway_route`
  traefik:
    # api | file
    provider: api
    # when provider=api, set your provider API base url
    base_url: http://localhost:8080
    upsert_path: /api/providers/http/routes/{route_key}
    delete_path: /api/providers/http/routes/{route_key}
    auth_token: ""
    timeout_second: 5
    # when provider=file, write dynamic config to this path
    # file_path: ./traefik/dynamic/routes.yaml
  k8s_ingress:
    namespace: default
    kubeconfig: ""
    in_cluster: false
    ingress_class_name: traefik
    # 留空表示不限制 Host，仅按 PathPrefix 路由
    host: ""
    # Prefix | Exact | ImplementationSpecific
    path_type: Prefix
    annotations: {}

storage:
  # 图片上传存储目录。支持绝对路径；相对路径按当前工作目录解析。
  # 留空时默认使用“可执行文件所在目录/images”。
  image_dir: ""

git:
  # git 提交身份：保存 script 时初始化/提交脚本版本仓库（go-git）使用。
  # 留空时回退到默认值 gobrave / gobrave@123.com
  user: gobrave
  email: gobrave@123.com
  # ssh 远端（git@gitee.com:owner/repo.git）的凭据由进程环境提供，不在这里配置：
  #   GIT_SSH_KEY             私钥文件路径；留空时依次尝试 ssh-agent（SSH_AUTH_SOCK）
  #                           与 ~/.ssh/id_ed25519 / id_ecdsa / id_rsa
  #   GIT_SSH_KEY_PASSPHRASE  私钥口令，私钥未加密时留空
  # https 远端可把 token 写进地址（https://<user>:<token>@gitee.com/owner/repo.git）。

realtime:
  # ws | sse
  transport: ws
  # 每个 user_id 同时在线连接数上限，超过会自动踢掉最早连接
  max_connections_per_user: 2
  # websocket 发送 require_ack 消息时的单次等待时长（秒）
  ack_timeout_seconds: 10
  # websocket ACK 超时后的重试次数
  ack_max_retries: 3

log:
  # 日志级别：trace / debug / info / warn / error / fatal / panic，默认 info。
  # 需要调试时改为 debug。
  level: info
  # 日志文件路径，留空使用默认路径 logs/app.log。
  path: ""
  # 颜色模式：auto（仅终端着色）/ always / never。
  color: auto

llm:
  cli_url: "localhost:4321"
  # gpt-5.5 | deepseek-v4-pro
  model: "deepseek-v4-pro"
  # github_token 与 provider 配置二选一，不能同时使用。若使用 provider，则 github_token 可留空。
  github_token: "github_pat_****"
  provider:
    type: "anthropic"
    base_url: "https://api.deepseek.com/anthropic"
    api_key: "sk-*****"
    bearer_token: ""

# AI Agent 调用框架配置。用于灵活切换第三方 Agent 与后续自研 Agent。
agent:
  # 模型提供商配置表（key 为模型名，与 Profile.model 对应）。
  # 一次请求使用的模型由 Profile.model 指定，据此在此表中查找 base_url / api_key 等 LLM 配置。
  providers:
    deepseek-v4-flash:
      model: "deepseek-v4-flash"
      base_url: "https://api.deepseek.com/anthropic"
      api_key: "sk-xxxxxxxxxxxxxxx"
      bearer_token: ""
      extra: { type: "anthropic" }
    deepseek-v4-pro:
      model: "deepseek-v4-pro"
      base_url: "https://api.deepseek.com/anthropic"
      api_key: "sk-xxxxxxxxxxxxxxx"
      bearer_token: ""
      extra: { type: "anthropic" }

container:
  # 启动时注册的容器运行时列表（可同时注册多个，例如 [docker, k8s]）。
  # 留空时回退到 default_runtime 指定的单一运行时。
  runtimes: [docker]
  # 默认使用的运行时（运行时未显式指定时优先使用）。
  # 留空时回退到 runtimes 第一个，最后回退到 docker。
  default_runtime: docker
  kubernetes:
    namespace: default
    # 留空时使用 KUBECONFIG 或 ~/.kube/config
    kubeconfig: ""
    # 在集群内运行时可设为 true，使用 in-cluster 配置
    in_cluster: false
  # 服务启动时是否异步刷新 ContainerImage 状态。
  # true: 启动 goroutine 刷新镜像状态；false: 跳过启动刷新。
  refresh_image_status_on_start: true
  # 服务启动时是否自动恢复 job_status=running 的 analysis DAG。
  # true: 扫描并尝试恢复；false: 不自动恢复。
  recover_running_dag_on_start: true
  # DAG 启动前是否按 analysis_id 删除全部 owner_type=dag_node 的容器实例（包含运行中和失败残留）。
  # true: 启动前先清理，避免冗余 container instance；false: 跳过此步骤。
  cleanup_dag_node_containers_before_start: true
  # DAG 节点容器正常退出（exit_code=0）后是否立即删除 docker 和 container instance。
  # true: 节点完成后立刻删除；false: 不立即删除，交给 DAG 结束阶段策略处理。
  delete_container_on_node_success: true
  # DAG 节点失败时，是否自动回收 owner_type=dag_node 的容器实例。
  # 可选: none | stop | delete
  dag_node_cleanup_on_failed: stop
  # DAG 流程结束（finished/failed/timeout）时，是否自动回收 owner_type=dag_node 的容器实例。
  # 可选: none | stop | delete
  dag_node_cleanup_on_dag_finished: delete
  # 是否启用容器创建队列。启用后，CreateByTemplate 会将创建请求写入 outbox，
  # 由后台 worker 以受控并发度异步执行，避免瞬间大量容器创建耗尽资源。
  create_queue_enabled: false
  # 容器创建队列的最大并发数（同时创建多少个容器）。
  create_queue_max_concurrency: 3
  # 容器创建队列的最大排队数（超出后新请求直接返回错误）。
  create_queue_max_pending: 50
