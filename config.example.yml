server:
  port: 8083
  # Gin 运行模式：debug / release / test。
  # release 关闭 Gin 调试输出与 Swagger 文档；留空时回退到 GIN_MODE 环境变量，默认 debug。
  mode: debug
database:
  driver: mysql
  # driver: sqlite
  host: 192.168.3.60
  port: 53306
  user: root
  password: "123456"
  name: ai_agent_go
  # GORM SQL 日志级别：silent / error / warn / info。留空或非法值按 warn。
  # warn 只打印慢查询与报错的 SQL（默认）；info 打印每条 SQL，仅排查问题时开启；
  # silent 完全关闭。与 log.level（进程日志级别）互不影响。
  log_level: warn

# ingest:
#   enabled: true
#   fetch_interval_sec: 300
#   http_timeout_sec: 15
#   fetch_workers: 1
#   parser_grpc_addr: 127.0.0.1:50051
#   parser_grpc_insecure: true
#   parser_grpc_timeout_sec: 8
#   parser_dispatch_batch_size: 100
#   parser_callback_secret: ""

proxy:
  brave_api: http://localhost:5000
  container: http://localhost:8089
  onlyoffice: http://localhost:8080
  # outbound proxy for external HTTP(S) requests (e.g. agent fetch tool).
  # leave empty to connect directly; env http_proxy / https_proxy are ignored.
  http_proxy: ""
  https_proxy: ""
  # hosts that bypass the proxy, comma separated (domain / IP / CIDR)
  no_proxy: localhost,127.0.0.1

route:
  # gateway | traefik | k8s-ingress
  registry: gateway
  # analysis app reverse proxy prefix
  apps_prefix: /c/analysis/apps
  # gateway registry mapping persistence uses database table `go_gateway_route`
  traefik:
    # api | file
    provider: api
    # when provider=api, set your provider API base url
    base_url: http://localhost:8080
    upsert_path: /api/providers/http/routes/{route_key}
    delete_path: /api/providers/http/routes/{route_key}
    auth_token: ""
    timeout_second: 5
    # when provider=file, write dynamic config to this path
    # file_path: ./traefik/dynamic/routes.yaml
  k8s_ingress:
    namespace: default
    kubeconfig: ""
    in_cluster: false
    ingress_class_name: traefik
    # 留空表示不限制 Host，仅按 PathPrefix 路由
    host: ""
    # Prefix | Exact | ImplementationSpecific
    path_type: Prefix
    annotations: {}

storage:
  # 图片上传存储目录。支持绝对路径；相对路径按当前工作目录解析。
  # 留空时默认使用“可执行文件所在目录/images”。
  image_dir: ""

git:
  # git 提交身份：保存 script 时初始化/提交脚本版本仓库（go-git）使用。
  # 留空时回退到默认值 gobrave / gobrave@123.com
  user: gobrave
  email: gobrave@123.com
  # ssh 远端（git@gitee.com:owner/repo.git）的凭据由进程环境提供，不在这里配置：
  #   GIT_SSH_KEY             私钥文件路径；留空时依次尝试 ssh-agent（SSH_AUTH_SOCK）
  #                           与 ~/.ssh/id_ed25519 / id_ecdsa / id_rsa
  #   GIT_SSH_KEY_PASSPHRASE  私钥口令，私钥未加密时留空
  # https 远端可把 token 写进地址（https://<user>:<token>@gitee.com/owner/repo.git）。

realtime:
  # ws | sse
  transport: ws
  # 每个 user_id 同时在线连接数上限，超过会自动踢掉最早连接
  max_connections_per_user: 2
  # websocket 发送 require_ack 消息时的单次等待时长（秒）
  ack_timeout_seconds: 10
  # websocket ACK 超时后的重试次数
  ack_max_retries: 3

log:
  # 日志级别：trace / debug / info / warn / error / fatal / panic，默认 info。
  # 需要调试时改为 debug。
  level: info
  # 日志文件路径，留空使用默认路径 logs/app.log。
  path: ""
  # 颜色模式：auto（仅终端着色）/ always / never。
  color: auto

llm:
  cli_url: "localhost:4321"
  # gpt-5.5 | deepseek-v4-pro
  model: "deepseek-v4-pro"
  # github_token 与 provider 配置二选一，不能同时使用。若使用 provider，则 github_token 可留空。
  github_token: "github_pat_****"
  provider:
    type: "anthropic"
    base_url: "https://api.deepseek.com/anthropic"
    api_key: "sk-*****"
    bearer_token: ""

# AI Agent 调用框架配置。用于灵活切换第三方 Agent 与后续自研 Agent。
agent:
  # 模型提供商配置表（key 为模型名，与 Profile.model 对应，统一小写）。
  # 一次请求使用的模型由 Profile.model 指定，据此在此表中查找 base_url / api_key 等 LLM 配置。
  #
  # 极简写法：只填 provider（厂商类型）+ api_model（真实模型名）+ api_key，
  # 其余参数（base_url / context_window / default_max_tokens / can_reason /
  # supports_attachments / 价格）由内置厂商预置表自动补齐。
  # 可视化配置页的「模型厂商 → 模型 → API Key」表单即按此写法保存，
  # 厂商与模型选项由 GET /api/v1/config/model/providers 下发。
  providers:
    deepseek-v4-flash:
      provider: "deepseek"
      api_model: "deepseek-v4-flash"
      api_key: "sk-xxxxxxxxxxxxxxx"
    deepseek-v4-pro:
      provider: "deepseek"
      api_model: "deepseek-v4-pro"
      api_key: "sk-xxxxxxxxxxxxxxx"

# 外部 MCP（Model Context Protocol）服务。
# 启用后，服务启动时会连接各 MCP 服务并把其工具注册到 Agent 工具表，
# 工具名为 <服务名>_<工具名>（例如 filesystem_read_file），与内置工具共用权限门禁。
# 注意：工具在进程内缓存，修改本段后需重启进程生效。
mcp:
  # 总开关；false 时不会连接任何 MCP 服务。
  enabled: true
  # 启动时发现工具的超时时间（秒），超时后跳过该服务，不影响进程启动。
  timeout_seconds: 60
  servers:
    # 示例：Node.js 官方 filesystem 服务（stdio）。
    # stdio 的命令白名单：uvx / uv / npx / node / python / python3 / deno / bun；
    # 参数中禁止 shell 链式调用、命令替换、绝对路径二进制等危险写法，
    # 环境变量禁止 PATH / NODE_OPTIONS / LD_PRELOAD 等敏感变量。
    filesystem:
      type: stdio
      command: npx
      args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
    # 示例：SSE 服务。
    # remote:
    #   type: sse
    #   url: "http://127.0.0.1:3001/sse"
    #   headers:
    #     Authorization: "Bearer <token>"
    # 单个服务可用 enabled: false 关闭。

container:
  # 启动时注册的容器运行时列表（可同时注册多个，例如 [docker, k8s]）。
  # 留空时回退到 default_runtime 指定的单一运行时。
  runtimes: [docker]
  # 默认使用的运行时（运行时未显式指定时优先使用）。
  # 留空时回退到 runtimes 第一个，最后回退到 docker。
  default_runtime: docker
  kubernetes:
    namespace: default
    # 留空时使用 KUBECONFIG 或 ~/.kube/config
    kubeconfig: ""
    # 在集群内运行时可设为 true，使用 in-cluster 配置
    in_cluster: false
  docker:
    # docker daemon 是否运行在 WSL2 内（Windows 上通过 DOCKER_HOST=tcp://<wsl-ip>:2375 连接）。
    # 开启后 bind mount 的 Source 会从 Windows 盘符路径翻译成 WSL 视角：
    #   D:\gobrave\.gobrave → /mnt/d/gobrave/.gobrave
    # 不配置时（注释掉）Windows + DOCKER_HOST=tcp://… 自动视为 WSL daemon；其余情况为 false。
    # npipe://（Docker Desktop Windows daemon）不要开启。
    # wsl_daemon: true
    #
    # 运行时预置（provision）：由 gobrave 自己管理 dockerd 的启动，而不是依赖
    # 用户已经跑起来的 daemon。默认关闭；开启后每次启动做一次幂等的 Start 自检。
    #   enabled:      与平台无关。Windows 上拉起自管 WSL 发行版内的 dockerd，
    #                 Linux 上执行 systemctl start docker 管理本机 dockerd。
    #   distro / download_url / port: 仅 Windows 生效，Linux 实现会忽略。
    # 未安装时不会自动安装，只等 UI 安装向导。
    # provision:
    #   enabled: true
    #   distro: gobrave-ubuntu-docker
    #   download_url: ""
    #   port: 2375
  #
  # 应用容器端口的访问方式。
  #   container_ip（默认）：gobrave 直接访问容器 IP（docker0 / Pod IP），
  #                          不占用宿主机端口，多个同类应用（如两个 RStudio）不会冲突。
  #                          要求 gobrave 进程能路由到容器网络。
  #   host_port：容器端口随机发布到宿主机（-p 0.0.0.0:0:<port>），gobrave 通过
  #              127.0.0.1:<随机端口> 访问。用于无法路由容器 IP 的场景，
  #              典型是 Windows + WSL2 自管 dockerd（容器 IP 位于发行版的 docker0，
  #              Windows 不可路由）。
  network_mode: container_ip
  # 服务启动时是否自动恢复 job_status=running 的 analysis DAG。
  # true: 扫描并尝试恢复；false: 不自动恢复。
  recover_running_dag_on_start: true
  # DAG 启动前是否按 analysis_id 删除全部 owner_type=dag_node 的容器实例（包含运行中和失败残留）。
  # true: 启动前先清理，避免冗余 container instance；false: 跳过此步骤。
  cleanup_dag_node_containers_before_start: true
  # DAG 节点容器正常退出（exit_code=0）后是否立即删除 docker 和 container instance。
  # true: 节点完成后立刻删除；false: 不立即删除，交给 DAG 结束阶段策略处理。
  delete_container_on_node_success: true
  # DAG 节点失败时，是否自动回收 owner_type=dag_node 的容器实例。
  # 可选: none | stop | delete
  dag_node_cleanup_on_failed: stop
  # DAG 流程结束（finished/failed/timeout）时，是否自动回收 owner_type=dag_node 的容器实例。
  # 可选: none | stop | delete
  dag_node_cleanup_on_dag_finished: delete
  # 是否启用容器创建队列。启用后，CreateByTemplate 会将创建请求写入 outbox，
  # 由后台 worker 以受控并发度异步执行，避免瞬间大量容器创建耗尽资源。
  create_queue_enabled: false
  # 容器创建队列的最大并发数（同时创建多少个容器）。
  create_queue_max_concurrency: 3
  # 容器创建队列的最大排队数（超出后新请求直接返回错误）。
  create_queue_max_pending: 50
  # 容器模板终端：一个模板可以有多条终端会话，每条会话都是一个「应用会话」
  # （go_container_app_session）+ 一台常驻容器（owner_type=app_session）。容器以
  # terminalKeepAliveCommand 常驻，交互式 shell 由 docker exec / kubectl exec 打开。
  #
  # 回收规则按「会话是否持久」决定（go_container_app_session.persistent）：
  #   - 持久会话：前端只要通过 WS（GET /container/terminal/session/{id}/terminal）接入过，
  #     该会话即被标记为持久；Agent 的 terminal_exec 也可用 persistent=true 直接要求。
  #     断开 WebSocket（刷新 / 关标签 / 断网）都不会删除容器，只能由下面的
  #     空闲 TTL 到期，或用户显式调用 DELETE /container/terminal/session/{id} 回收。
  #   - 一次性会话：Agent 用 terminal_exec（persistent 默认 false）创建且从未被前端接入；
  #     命令结束、最后一个订阅者离开后立即删除会话与容器。
  #     因此 Agent 每次 terminal_exec 都会新建容器，除非它显式请求持久会话。
  # 持久标记只增不减：一次性会话经前端打开一次后即变为持久。
  #
  # 持久会话空闲上限（分钟）：超过该时长没有操作/输出，自动回收容器并删除会话记录。
  # <=0 使用默认 120。设为很大的值即"只随显式删除回收"（注意资源占用）。
  terminal_session_ttl_minutes: 120
  # 单用户同时存在的终端会话上限（<=0 默认 4），超出时新建会话会被拒绝。
  terminal_max_sessions_per_user: 4
  # 滚动缓冲落盘目录；留空使用 <storage.base_dir>/terminal_sessions。
  # 进程重启后从该目录回放历史输出（每会话一个文件，滚动覆盖）。
  terminal_buffer_dir: ""
  # 单个会话滚动缓冲上限（KB），<=0 默认 1024。
  terminal_buffer_kb: 1024
  # bash 工具（Agent 的命令执行工具）的实际执行位置：
  #   host      - 在 gobrave 宿主机上的持久 shell 里执行（默认）；
  #   container - 在用户的容器模板终端里执行，命令输出会显示在前端 xterm 中。
  # 该开关对 Agent 完全透明：bash 的入参 / 返回结构不变，Agent 不需要传容器信息。
  # 注意：container 模式要求会话有激活项目与 Agent 会话 ID，否则调用会返回错误。
  bash_execution_mode: host
  # bash_execution_mode=container 时使用的容器模板 ID（十进制 int64，注意超出 JS 安全整数范围时前端需用字符串）；
  # <=0 时使用代码默认值 config.DefaultBashContainerTemplateID（内置 ubuntu 模板的 definition 主键）。
  bash_container_template_id: 2112483278714834944
