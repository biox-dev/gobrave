name: Tag Release Artifacts

on:
  push:
    tags:
      - "v*"
      - "*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build brave-ui dist
        run: |
          set -euxo pipefail
          corepack enable
          rm -rf .tmp/brave-ui
          git clone --depth 1 https://github.com/gobravedev/brave-ui.git .tmp/brave-ui
          cd .tmp/brave-ui
          yarn install --frozen-lockfile
          yarn build

      - name: Prepare web assets
        run: |
          set -euxo pipefail
          rm -rf frontend/web
          mkdir -p frontend/web
          cp -a .tmp/brave-ui/dist/. frontend/web/

      - name: Build embedded single binary
        run: |
          set -euxo pipefail
          mkdir -p release
          TAG="${GITHUB_REF_NAME}"
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -tags embed_frontend -o "release/gobrave-${TAG}-linux-amd64-embed" .

      - name: Build standard binary
        run: |
          set -euxo pipefail
          TAG="${GITHUB_REF_NAME}"
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o "release/gobrave-${TAG}-linux-amd64" .

      - name: Build Windows binaries (server embed + desktop)
        run: |
          set -euxo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Windows server binaries with embedded frontend
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -tags embed_frontend -o "release/gobrave-${TAG}-windows-amd64-embed.exe" .
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -tags embed_frontend -o "release/gobrave-${TAG}-windows-arm64-embed.exe" .
          # Windows desktop binaries (Wails), frontend embedded.
          # 注意：cmd/desktop/main.go 带 `//go:build gtk3`，必须显式加 gtk3 标签；
          # 该标签在 Wails 中只对 linux 生效，windows 下无副作用。
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -tags "gtk3 embed_frontend" -o "release/gobrave-${TAG}-windows-amd64-desktop.exe" ./cmd/desktop
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -tags "gtk3 embed_frontend" -o "release/gobrave-${TAG}-windows-arm64-desktop.exe" ./cmd/desktop

      - name: Install Linux desktop build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Build Linux desktop binary (embedded UI)
        run: |
          set -euxo pipefail
          TAG="${GITHUB_REF_NAME}"
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -tags "gtk3 embed_frontend" -o "release/gobrave-${TAG}-linux-amd64-desktop" ./cmd/desktop
          chmod +x "release/gobrave-${TAG}-linux-amd64-desktop"

      - name: Package standard binary with web directory
        run: |
          set -euxo pipefail
          TAG="${GITHUB_REF_NAME}"
          PKG_DIR="release/pkg/gobrave-${TAG}-linux-amd64"
          rm -rf "$PKG_DIR"
          mkdir -p "$PKG_DIR/frontend/web"
          cp "release/gobrave-${TAG}-linux-amd64" "$PKG_DIR/gobrave"
          cp -a frontend/web/. "$PKG_DIR/frontend/web/"
          (cd release/pkg && zip -r "../gobrave-${TAG}-linux-amd64-with-web.zip" "gobrave-${TAG}-linux-amd64")

      - name: Package clean source
        run: |
          set -euxo pipefail
          TAG="${GITHUB_REF_NAME}"
          git archive --format=zip --output "release/gobrave-${TAG}-source.zip" "$GITHUB_SHA"

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/gobrave-${{ github.ref_name }}-linux-amd64-embed
            release/gobrave-${{ github.ref_name }}-linux-amd64-with-web.zip
            release/gobrave-${{ github.ref_name }}-source.zip
            release/gobrave-${{ github.ref_name }}-windows-amd64-embed.exe
            release/gobrave-${{ github.ref_name }}-windows-arm64-embed.exe
            release/gobrave-${{ github.ref_name }}-windows-amd64-desktop.exe
            release/gobrave-${{ github.ref_name }}-windows-arm64-desktop.exe
            release/gobrave-${{ github.ref_name }}-linux-amd64-desktop
