basePath: /api/v1
definitions:
  agent.ContextConfig:
    properties:
      inject_memory:
        type: boolean
      inject_project:
        type: boolean
    type: object
  agent.Conversation:
    properties:
      created_at:
        type: string
      current_task_id:
        description: |-
          CurrentTaskID 记录当前活跃轮次（running / waiting_permission）的任务 ID；
          轮次结束时置空。供前端刷新 / 切换会话时恢复实时流。
        example: "0"
        type: string
      id:
        example: "0"
        type: string
      messages:
        description: |-
          Messages 保存完整历史（system 提示词之外的 user/assistant 消息）。
          关系由 Repository 自行维护（独立表 agent_conversation_messages），
          不使用 GORM 的 HasMany 关联，因此标记为 gorm:"-"。
        items:
          $ref: '#/definitions/agent.Message'
        type: array
      model:
        type: string
      provider:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  agent.Memory:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      importance:
        description: Importance 表示记忆重要度（0-10），检索排序时权重更高。
        type: integer
      kind:
        $ref: '#/definitions/agent.MemoryKind'
      last_accessed_at:
        type: string
      metadata:
        additionalProperties: {}
        description: Metadata 承载扩展信息（来源、标签等），由序列化为 JSON 持久化。
        type: object
      session_id:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  agent.MemoryKind:
    enum:
    - fact
    - summary
    - note
    - event
    type: string
    x-enum-comments:
      MemoryKindEvent: 事件记录（带时间语义）
      MemoryKindFact: 用户偏好 / 事实（长期有效）
      MemoryKindNote: 通用备注
      MemoryKindSummary: 会话 / 任务摘要
    x-enum-descriptions:
    - 用户偏好 / 事实（长期有效）
    - 会话 / 任务摘要
    - 通用备注
    - 事件记录（带时间语义）
    x-enum-varnames:
    - MemoryKindFact
    - MemoryKindSummary
    - MemoryKindNote
    - MemoryKindEvent
  agent.Message:
    properties:
      content:
        description: 文本内容
        type: string
      data: {}
      kind:
        type: string
      role:
        description: system / user / assistant / tool
        type: string
      task_id:
        example: "0"
        type: string
    type: object
  agent.Operation:
    properties:
      command:
        description: execute
        type: string
      content:
        description: write
        type: string
      id:
        type: string
      metadata:
        additionalProperties: {}
        description: Metadata 承载操作相关的扩展信息（如命令参数、网络地址等）。
        type: object
      path:
        description: read / write / delete / move
        type: string
      type:
        $ref: '#/definitions/agent.OperationType'
    type: object
  agent.OperationType:
    enum:
    - read
    - write
    - delete
    - move
    - execute
    - network
    type: string
    x-enum-comments:
      OperationDelete: 删除文件
      OperationExecute: 执行命令 / 脚本
      OperationMove: 移动 / 重命名文件
      OperationNetwork: 网络访问
      OperationRead: 读取文件
      OperationWrite: 写入 / 修改文件
    x-enum-descriptions:
    - 读取文件
    - 写入 / 修改文件
    - 删除文件
    - 移动 / 重命名文件
    - 执行命令 / 脚本
    - 网络访问
    x-enum-varnames:
    - OperationRead
    - OperationWrite
    - OperationDelete
    - OperationMove
    - OperationExecute
    - OperationNetwork
  agent.PermissionDecision:
    enum:
    - allow
    - deny
    - ask
    type: string
    x-enum-comments:
      DecisionAllow: 允许执行
      DecisionAsk: 需要人工确认
      DecisionDeny: 拒绝执行
    x-enum-descriptions:
    - 允许执行
    - 拒绝执行
    - 需要人工确认
    x-enum-varnames:
    - DecisionAllow
    - DecisionDeny
    - DecisionAsk
  agent.PermissionRequest:
    properties:
      created_at:
        type: string
      id:
        example: "0"
        type: string
      operation:
        $ref: '#/definitions/agent.Operation'
      resolved_at:
        type: string
      resolved_by:
        type: string
      session_id:
        type: string
      status:
        $ref: '#/definitions/agent.PermissionStatus'
      task_id:
        example: "0"
        type: string
      updated_at:
        type: string
    type: object
  agent.PermissionStatus:
    enum:
    - pending
    - approved
    - denied
    - expired
    - canceled
    - consumed
    type: string
    x-enum-comments:
      PermissionApproved: 已批准
      PermissionCanceled: 已取消（任务被取消等）
      PermissionConsumed: 已消费：Agent 已恢复并继续执行
      PermissionDenied: 已拒绝
      PermissionExpired: 已过期
      PermissionPending: 等待人工确认
    x-enum-descriptions:
    - 等待人工确认
    - 已批准
    - 已拒绝
    - 已过期
    - 已取消（任务被取消等）
    - 已消费：Agent 已恢复并继续执行
    x-enum-varnames:
    - PermissionPending
    - PermissionApproved
    - PermissionDenied
    - PermissionExpired
    - PermissionCanceled
    - PermissionConsumed
  agent.Profile:
    properties:
      context:
        $ref: '#/definitions/agent.ContextConfig'
      created_at:
        type: string
      description:
        type: string
      display_name:
        type: string
      id:
        example: "0"
        type: string
      is_builtin:
        type: boolean
      is_default:
        type: boolean
      model:
        description: |-
          Model 指定本 Profile 使用的模型名（对应 config.agent.providers 的 key）。
          为空时回退到请求级 req.Model（若仍未指定则由 Provider 兜底）。
        type: string
      name:
        type: string
      provider:
        description: |-
          Provider 指定本 Profile 使用的 Agent（Provider）名称（mock | claude_code | codex | copilot | custom）。
          为空时回退到请求级 req.Provider（若仍未指定则由 Client 的默认 Provider 兜底）。
        type: string
      skills:
        items:
          type: string
        type: array
      system_prompt:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  agent.Request:
    properties:
      env:
        additionalProperties:
          type: string
        description: Env 可选：额外环境变量（也可携带 Provider 特有开关）。
        type: object
      max_tokens:
        description: MaxTokens 可选：最大输出 token 数，0 表示不限制。
        type: integer
      messages:
        description: Messages 对话上下文（不含 SystemPrompt）。
        items:
          $ref: '#/definitions/agent.Message'
        type: array
      model:
        description: Model 可选：模型名称，为空时由 Provider 自行决定。
        type: string
      profile:
        description: Profile 可选：AgentProfile 名称，AgentService 据此解析系统提示词、技能与上下文注入开关。
        type: string
      provider:
        description: Provider 可选：强制指定 Provider 名称；为空则使用 Client 的默认 Provider。
        type: string
      session_id:
        description: SessionID 可选：会话标识，用于把多次调用关联到同一会话（与权限 / 任务联动）。
        type: string
      skills:
        description: Skills 可选：本次调用启用的技能名列表；为空表示使用默认全部技能。
        items:
          type: string
        type: array
      stream:
        description: Stream 可选：任务模式下是否使用流式调用；默认 false 使用 Invoke。
        type: boolean
      system_prompt:
        description: SystemPrompt 系统提示词。
        type: string
      user_id:
        description: UserID 可选：发起调用的用户，用于记忆（memory）的归属隔离与检索。
        type: string
      working_dir:
        description: WorkingDir 可选：Agent 执行的工作目录。
        type: string
    type: object
  agent.Task:
    properties:
      created_at:
        type: string
      error:
        description: Error 保存最近一次错误信息（Status == failed 时有效）。
        type: string
      finished_at:
        type: string
      id:
        example: "0"
        type: string
      model:
        type: string
      provider:
        type: string
      request:
        allOf:
        - $ref: '#/definitions/agent.Request'
        description: Request 保存原始请求，用于恢复时重建上下文。
      session_id:
        type: string
      started_at:
        type: string
      status:
        $ref: '#/definitions/agent.TaskStatus'
      updated_at:
        type: string
      working_dir:
        type: string
    type: object
  agent.TaskStatus:
    enum:
    - created
    - running
    - waiting_permission
    - completed
    - failed
    - canceled
    type: string
    x-enum-comments:
      TaskCanceled: 已取消
      TaskCompleted: 已完成
      TaskCreated: 已创建，尚未开始
      TaskFailed: 失败
      TaskRunning: 正在执行
      TaskWaitingPermission: 等待权限确认
    x-enum-descriptions:
    - 已创建，尚未开始
    - 正在执行
    - 等待权限确认
    - 已完成
    - 失败
    - 已取消
    x-enum-varnames:
    - TaskCreated
    - TaskRunning
    - TaskWaitingPermission
    - TaskCompleted
    - TaskFailed
    - TaskCanceled
  agent.UserAgentConfig:
    properties:
      permissions:
        additionalProperties:
          $ref: '#/definitions/agent.PermissionDecision'
        type: object
      profile:
        type: string
    type: object
  containerruntime.RuntimeDescription:
    properties:
      format:
        description: Format 描述 Raw 的格式，便于前端渲染，例如 json / yaml / text。
        type: string
      kind:
        description: Kind 标识资源类型，例如 container / deployment / job / service。
        type: string
      name:
        description: Name 资源名称（docker 容器名，或 k8s workload/service 名）。
        type: string
      raw:
        description: Raw 原始 inspect/describe 输出，保持后端运行时的原生格式。
        type: string
    type: object
  errors.AppError:
    properties:
      code:
        $ref: '#/definitions/errors.ErrorCode'
      details: {}
      message:
        type: string
    type: object
  errors.ErrorCode:
    enum:
    - 1000
    - 1001
    - 1002
    - 1003
    - 1004
    - 1005
    - 1006
    - 1007
    - 1008
    - 1009
    - 1010
    - 2000
    - 2001
    - 2002
    - 2003
    - 2004
    - 2100
    - 2101
    - 2102
    - 2103
    type: integer
    x-enum-varnames:
    - ErrBadRequest
    - ErrUnauthorized
    - ErrForbidden
    - ErrNotFound
    - ErrMethodNotAllowed
    - ErrConflict
    - ErrTooManyRequests
    - ErrInternalServer
    - ErrServiceUnavailable
    - ErrTimeout
    - ErrValidation
    - ErrTenantNotFound
    - ErrTenantAlreadyExists
    - ErrTenantInactive
    - ErrTenantNameRequired
    - ErrTenantInvalidStatus
    - ErrAgentMissingThinkingModel
    - ErrAgentMissingAllowedTools
    - ErrAgentInvalidMaxIterations
    - ErrAgentInvalidTemperature
  gin.H:
    additionalProperties: {}
    type: object
  github_com_biox-dev_gobrave_internal_agent.AgentEvent:
    properties:
      created_at:
        type: string
      id:
        example: "0"
        type: string
      payload: {}
      sequence:
        type: integer
      task_id:
        example: "0"
        type: string
      type:
        $ref: '#/definitions/github_com_biox-dev_gobrave_internal_agent.AgentEventType'
    type: object
  github_com_biox-dev_gobrave_internal_agent.AgentEventType:
    enum:
    - task.created
    - task.started
    - task.waiting
    - task.completed
    - task.failed
    - task.canceled
    - permission.created
    - permission.resolved
    - memory.saved
    - memory.deleted
    - stream
    type: string
    x-enum-comments:
      EventMemoryDeleted: 记忆已删除（Payload 为 Memory）
      EventMemorySaved: 记忆已保存（Payload 为 Memory）
      EventPermissionCreated: 新增待确认权限
      EventPermissionResolved: 权限已被批准 / 拒绝
      EventStream: 透传的流式事件（Payload 为 StreamEvent）
      EventTaskCanceled: 任务取消
      EventTaskCompleted: 任务完成
      EventTaskCreated: 任务已创建
      EventTaskFailed: 任务失败
      EventTaskStarted: 任务开始执行
      EventTaskWaiting: 任务进入等待权限状态
    x-enum-descriptions:
    - 任务已创建
    - 任务开始执行
    - 任务进入等待权限状态
    - 任务完成
    - 任务失败
    - 任务取消
    - 新增待确认权限
    - 权限已被批准 / 拒绝
    - 记忆已保存（Payload 为 Memory）
    - 记忆已删除（Payload 为 Memory）
    - 透传的流式事件（Payload 为 StreamEvent）
    x-enum-varnames:
    - EventTaskCreated
    - EventTaskStarted
    - EventTaskWaiting
    - EventTaskCompleted
    - EventTaskFailed
    - EventTaskCanceled
    - EventPermissionCreated
    - EventPermissionResolved
    - EventMemorySaved
    - EventMemoryDeleted
    - EventStream
