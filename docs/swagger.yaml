  utils.GitSyncState:
    properties:
      has_local_changes:
        description: HasLocalChanges 本地有未发布改动 = 未提交改动 或 本地领先 store。
        type: boolean
      has_store_changes:
        description: HasStoreChanges store 有本地未同步的提交（远端有更新）。
        type: boolean
      in_sync:
        description: InSync 本地干净且两侧 commit 一致。
        type: boolean
      local_ahead:
        description: LocalAhead 本地 HEAD 领先 store：存在已提交但未发布的改动。
        type: boolean
      local_commit:
        description: LocalCommit 本地工作区 HEAD 的提交 hash（尚无提交时为空）。
        type: string
      local_dir:
        type: string
      local_dirty:
        description: LocalDirty 本地工作区存在未提交改动（新增/修改/删除，含未跟踪文件）。
        type: boolean
      local_initialized:
        description: LocalInitialized 本地目录是否已是一个 git 仓库（脚本/工作流的版本目录）。
        type: boolean
      remotes:
        description: |-
          Remotes 是 store 裸仓库上配置的远程仓库列表（github / gitee / origin ...），
          从磁盘 git 配置实时读取、不落库：发布到远程（PublishStoreRemote）只把地址写成
          store 仓库的 remote，不经数据库，因此这里就是「已配置的远程仓库」的唯一数据源。
          没有 store 仓库或未配置任何 remote 时为空。
        items:
          $ref: '#/definitions/utils.GitRemote'
        type: array
      store_ahead:
        description: StoreAhead store 领先本地：远端有本地没有的提交（需要 install/同步）。
        type: boolean
      store_commit:
        description: StoreCommit 发布目标 HEAD 的提交 hash（未发布时为空）。
        type: string
      store_dir:
        type: string
      store_initialized:
        description: StoreInitialized 发布目标是否已是一个 git 仓库（即是否已发布过）。
        type: boolean
    type: object
